services:
  bot:
    image: partizan-telegram-bot:local
    build:
      context: .
      target: runtime
    env_file: ${BOT_ENV_FILE:-.env}
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8787"
      STATE_FILE: /data/bot.sqlite3
    ports:
      - "127.0.0.1:${HTTP_PORT:-8787}:8787"
    volumes:
      - bot-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  bot-data:
