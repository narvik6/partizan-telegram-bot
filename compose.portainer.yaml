services:
  bot:
    image: ghcr.io/narvik6/partizan-telegram-bot:latest
    pull_policy: always
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in Portainer stack environment}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-socks5h://throne:2080}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8787"
      STATE_FILE: /data/bot.sqlite3
    ports:
      - "127.0.0.1:${HTTP_PORT:-8787}:8787"
    volumes:
      - bot-data:/data
    networks:
      vpn:
        aliases:
          - partizan-telegram-bot
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:

networks:
  vpn:
    external: true
    name: vpn
