name: Test, publish and redeploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication and webhook calls so an old run cannot overwrite latest.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build test image
        run: docker build --target test -t partizan-bot-test .
      - name: Run isolated tests
        run: docker run --rm --network none --read-only --tmpfs /tmp:size=16m --cap-drop=ALL --security-opt no-new-privileges:true partizan-bot-test

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/narvik6/partizan-telegram-bot:latest
            ghcr.io/narvik6/partizan-telegram-bot:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/narvik6/partizan-telegram-bot
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  redeploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify Portainer when configured
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        shell: bash
        run: |
          if [[ -z "$PORTAINER_WEBHOOK_URL" ]]; then
            echo "Portainer webhook is not configured; image was published."
            exit 0
          fi
          # Do not print the secret URL or response body. A successful POST
          # acknowledges the redeploy request, not completion of the deployment.
          if ! status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --connect-timeout 10 --max-time 60 \
            --proto '=https' "$PORTAINER_WEBHOOK_URL"); then
            echo "Portainer webhook request failed."
            exit 1
          fi
          if [[ "$status" != 2* ]]; then
            echo "Portainer rejected the redeploy request (HTTP $status)."
            exit 1
          fi
          echo "Portainer accepted the redeploy request."
